<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Muestra de la estética tinta</title>
<!-- Hoja de muestra de la estética "tinta y pergamino" de Tower Chaos (js/inkart.js): figuras y baldosas en grande.
     Sirve para revisar el arte sin entrar al juego. -->
<style>body { margin: 0; background: #e9dcc0; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1000" height="900"></canvas>
<script>const TILE = 34;</script>
<script src="../js/sprites.js"></script>
<script src="../js/inkart.js"></script>
<script src="../js/data/gameIcons.js"></script>
<script>
const g = document.getElementById('c').getContext('2d');
g.fillStyle = INK.paper; g.fillRect(0, 0, 1000, 420);
const HERO_WEAPONS = { AXE: { shape: 'hammer' } }; // solo para la muestra
const looks = [
    ['hoodedKnight', { main: inkMute('#a33a3a', 0.25), accent: inkMute('#c9a227', 0.25), weapon: 'sword' }, 'Aventurero (espada)'],
    ['hoodedKnight', { main: inkMute('#69db7c', 0.25), hood: inkMute('#74c0fc', 0.25), accent: inkMute('#ff6b6b', 0.25), weapon: 'staff' }, 'Aventurero (báculo)'],
    ['footman', { main: inkMute('#ffb703'), accent: '#7a5c3c' }, 'Grunt'],
    ['archer', { main: inkMute('#8ecae6'), accent: inkMute('#e63946') }, 'Arquero'],
    ['mage', { main: inkMute('#7b6cd9'), accent: inkMute('#ffd166') }, 'Chamán'],
    ['plague', { main: inkMute('#d4a017'), accent: '#7a5c3c' }, 'Sanador'],
    ['brute', { main: inkMute('#e63946'), accent: inkMute('#2f9e8f') }, 'Bruto'],
    ['wraith', { main: inkMute('#8e7cc3'), accent: inkMute('#a8e6cf') }, 'Espectro']];
looks.forEach(([plan, look, name], i) => {
    const f = inkFigure(plan, look);
    g.drawImage(f.img, 6 + i * 122, 6, INK_W * 1.8, INK_H * 1.8);
    g.fillStyle = INK.line; g.font = '13px serif'; g.fillText(name, 12 + i * 122, 192);
});
// Ciclo de caminata (8 cuadros) del aventurero y del mago
['hoodedKnight', 'mage'].forEach((plan, row) => {
    const look = row ? looks[4][1] : looks[0][1];
    for (let k = 0; k < INK_WALK_FRAMES; k++) g.drawImage(inkFigure(plan, look, 'walk', k).img, 430 + k * 70, 230 + row * 200, INK_W * 1.3, INK_H * 1.3);
});
g.fillText('caminata: 8 cuadros', 430, 222);
const t = inkTiles();
[t.face, t.top, t.floors[0], t.floors[1]].forEach((im, i) => g.drawImage(im, 20 + i * 90, 220, 80, 80));
g.fillText('pared (frente) · pared (arriba) · piso · piso', 20, 320);
// Jefes, creeps chicos y bestias de los biomas (fila de abajo)
g.fillStyle = INK.paper; g.fillRect(0, 640, 1000, 260);
[['golem', '#adb5bd', 'Gólem'], ['hiveQueen', '#b5e48c', 'Reina'], ['frostDragon', '#90e0ef', 'Dragón'], ['abyssLord', '#9d0208', 'Señor del Abismo'], ['hydra', '#52b788', 'Hidra'],
 ['lich', '#c77dff', 'Liche'], ['bloodTitan', '#e63946', 'Titán'], ['phantom', '#e0e1dd', 'Espectro'], ['swarm', '#b5e48c', 'Enjambre'], ['kamikaze', '#fb8500', 'Kamikaze'],
 ['chusma', '#6c757d', 'Chusma'], ['wolf', '#8d8d8d', 'Lobo'], ['boar', '#8b5e3c', 'Jabalí'], ['toad', '#7a9a3a', 'Sapo'], ['scorpion', '#c08552', 'Escorpión'], ['lizard', '#dc2f02', 'Salamandra']]
    .forEach(([plan, col, name], i) => {
        const f = inkFigure(plan, { main: inkMute(col), accent: inkMute(shade(col, 0.35), 0.4) }, 'walk', 2);
        const x = 4 + (i % 8) * 124, y = 640 + Math.floor(i / 8) * 130;
        g.drawImage(f.img, x, y, INK_W * 1.2, INK_H * 1.2);
        g.fillStyle = INK.line; g.font = '12px serif'; g.fillText(name, x + 70, y + 110);
    });
// Íconos de game-icons.net repintados en tinta (habilidades arriba, armas y ranuras abajo)
g.fillStyle = INK.paper; g.fillRect(0, 420, 1000, 220);
const cols = ['#a33a3a', '#2d6a4f', '#1d4e89'];
const draw = (names, y, badge) => names.forEach((n, i) => { const im = new Image(); im.onload = () => g.drawImage(im, 8 + (i % 25) * 39, y + Math.floor(i / 25) * 40); im.src = inkGameIcon(n, inkMute(cols[i % 3], 0.2), badge ? Object.values(GAME_ICON_FOR.skills)[i] : null, INK.line); });
draw(Object.values(GAME_ICON_FOR.skills), 424);
draw(Object.values(GAME_ICON_FOR.weapons).concat(Object.values(GAME_ICON_FOR.slots)), 548, true);
</script>
</body>
</html>
