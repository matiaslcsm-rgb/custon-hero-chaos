<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tower Chaos 3D (prototipo)</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>
    <canvas id="view"></canvas>

    <!-- Interfaz encima del juego -->
    <div id="hud">
        <div id="crosshair">·</div>
        <div id="bars">
            <div class="bar"><div id="hp-fill"></div><span id="hp-text"></span></div>
            <div class="bar mana"><div id="mp-fill"></div><span id="mp-text"></span></div>
        </div>
        <div id="weapon-name"></div>
        <div id="floor-name"></div>
        <div id="log"></div>
        <div id="hurt"></div>
    </div>

    <!-- Pantalla de inicio / pausa / muerte -->
    <div id="overlay">
        <h1>TOWER CHAOS</h1>
        <h2 id="ov-sub">prototipo en 3D · estética PS1</h2>
        <p id="ov-text">Despertás en el fondo de la torre. Solo tenés una espada, un bastón y la oscuridad.</p>
        <button id="ov-btn">Entrar</button>
        <div class="controls">
            <b>W A S D</b> moverse · <b>mouse</b> mirar · <b>Shift</b> correr<br>
            <b>clic izquierdo</b> atacar · <b>1</b> espada · <b>2</b> bastón (gasta maná)<br>
            <b>E</b> agarrar / bajar la escalera · <b>Esc</b> pausa
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
